---
version: '2'
services:
  db:
    image: openbuildservice/mariadb
  frontend:
    image: openbuildservice/frontend
    networks:
    - traefik
    - default
    volumes:
    - ".:/obs"
    environment:
    - RAILS_RELATIVE_URL_ROOT={{ root_url }}
    expose:
    - 3000
    labels:
      traefik.enable: 'true'
      traefik.http.routers.{{ app_name }}.rule: {{ traefik_frontend_rule }}
      traefik.http.routers.{{ app_name }}.entrypoints: web
      traefik.docker.network: traefik_default
      traefik.port: '3000'
    depends_on:
    - db
networks:
  traefik:
    external: true
    name: traefik_default
